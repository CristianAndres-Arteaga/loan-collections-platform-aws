AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Module 2 - RDS PostgreSQL (Free Tier: Single-AZ, AWS-managed encryption key,
  master password from SSM SecureString) for Loan Collections Platform.

Parameters:
  EnablePublicAccess:
    Type: String
    Description: "Acceso publico temporal a RDS para carga manual de DDL. Revertir a false apenas termine la tarea."
    Default: "false"
    AllowedValues: ["true", "false"]

  EnableMultiAz:
    Type: String
    Description: "Standby sincrona en otra AZ (x2 costo instancia+storage). Solo para pruebas de failover; revertir a false al terminar."
    Default: "false"
    AllowedValues: ["true", "false"]

Resources:

  # --- DB Subnet Group ---
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupName: loan-collections-db-subnet-group
      DBSubnetGroupDescription: "Subnets para RDS PostgreSQL - Sistema de Prestamos y Cobranza"
      SubnetIds:
        - !ImportValue loan-collections-platform-db-subnet-1a
        - !ImportValue loan-collections-platform-db-subnet-1b
      Tags:
        - Key: Name
          Value: loan-collections-db-subnet-group

  # --- Security Group (ingress desde el bastion host y las EC2 de app) ---
  DBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "Security Group para RDS PostgreSQL"
      VpcId: !ImportValue loan-collections-platform-vpc-id
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !ImportValue loan-collections-bastion-sg-id
          Description: "Acceso desde el bastion host via SSM"
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !ImportValue loan-collections-ec2-app-sg-id
          Description: "Acceso desde las instancias EC2 de la aplicacion"
      Tags:
        - Key: Name
          Value: loan-collections-db-sg

  # --- RDS Instance (Free Tier: db.t3.micro, Single-AZ por defecto, 20GB gp3) ---
  DBInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: loan-collections-db
      Engine: postgres
      EngineVersion: "16.15"
      DBInstanceClass: db.t3.micro
      AllocatedStorage: 20
      StorageType: gp3
      MultiAZ: !Ref EnableMultiAz
      DBSubnetGroupName: !Ref DBSubnetGroup
      VPCSecurityGroups:
        - !Ref DBSecurityGroup
      PubliclyAccessible: !Ref EnablePublicAccess
      StorageEncrypted: true
      MasterUsername: loanadmin
      # Unica fuente de verdad: el mismo SecureString que lee el user-data (Modulo 5).
      MasterUserPassword: '{{resolve:ssm-secure:/loan-collections/db-password}}'
      BackupRetentionPeriod: 1
      DeletionProtection: true
      Tags:
        - Key: Name
          Value: loan-collections-db

Outputs:
  DBInstanceIdentifier:
    Value: !Ref DBInstance
    Export:
      Name: loan-collections-db-identifier

  DBEndpointAddress:
    Value: !GetAtt DBInstance.Endpoint.Address
    Export:
      Name: loan-collections-db-endpoint

  DBEndpointPort:
    Value: !GetAtt DBInstance.Endpoint.Port
    Export:
      Name: loan-collections-db-port

  DBSecurityGroupId:
    Value: !Ref DBSecurityGroup
    Export:
      Name: loan-collections-db-sg-id