AWSTemplateFormatVersion: '2010-09-09'
Description: Module 6 - Application Load Balancer (HTTP:80 temporal, ver ADR-0010)

Parameters:
  CreateAlb:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Interruptor de costo. Encender solo para pruebas.

  AllowedClientCidr:
    Type: String
    Default: '127.0.0.1/32'
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/32$'
    ConstraintDescription: Debe ser una unica IP en formato x.x.x.x/32
    Description: IP publica del desarrollador. Se pasa en el deploy, nunca se commitea.

  AppPort:
    Type: Number
    Default: 8080

  HealthCheckPath:
    Type: String
    Default: /health

Conditions:
  AlbEnabled: !Equals [!Ref CreateAlb, 'true']

Resources:
  # Sin Condition a proposito: un Target Group no cuesta nada y su ARN
  # tiene que existir siempre para que 05-compute.yaml pueda importarlo.
  AppTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: loan-collections-app-tg
      VpcId: !ImportValue loan-collections-platform-vpc-id
      TargetType: instance
      Protocol: HTTP
      Port: !Ref AppPort
      HealthCheckEnabled: true
      HealthCheckProtocol: HTTP
      HealthCheckPath: !Ref HealthCheckPath
      HealthCheckPort: traffic-port
      HealthCheckIntervalSeconds: 15
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: '200'
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '30'

  AlbHttpIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: AlbEnabled
    Properties:
      GroupId: !ImportValue loan-collections-alb-sg-id
      IpProtocol: tcp
      FromPort: 80
      ToPort: 80
      CidrIp: !Ref AllowedClientCidr
      Description: HTTP temporal solo desde IP del desarrollador (ADR-0010)

  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Condition: AlbEnabled
    Properties:
      Name: loan-collections-alb
      Type: application
      Scheme: internet-facing
      IpAddressType: ipv4
      Subnets:
        - !ImportValue loan-collections-platform-public-subnet-1a
        - !ImportValue loan-collections-platform-public-subnet-1b
      SecurityGroups:
        - !ImportValue loan-collections-alb-sg-id
      LoadBalancerAttributes:
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: 'true'

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: AlbEnabled
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref AppTargetGroup

Outputs:
  TargetGroupArn:
    Description: ARN del Target Group, lo importa 05-compute.yaml
    Value: !Ref AppTargetGroup
    Export:
      Name: loan-collections-alb-target-group-arn

  AlbDnsName:
    Condition: AlbEnabled
    Description: DNS publico del ALB para probar con curl
    Value: !GetAtt ApplicationLoadBalancer.DNSName