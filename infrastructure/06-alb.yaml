AWSTemplateFormatVersion: '2010-09-09'
Description: Modules 6/8 - Application Load Balancer detras de CloudFront (ver ADR-0010, ADR-0013)

Parameters:
  CreateAlb:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Interruptor de costo. Enciende ALB + CloudFront juntos, solo para pruebas.

  AllowedClientCidr:
    Type: String
    Default: '127.0.0.1/32'
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/32$'
    ConstraintDescription: Debe ser una unica IP en formato x.x.x.x/32
    Description: IP publica del desarrollador. La usa la CloudFront Function. Se pasa en el deploy, nunca se commitea.

  OriginVerifySecret:
    Type: String
    NoEcho: true
    MinLength: 32
    AllowedPattern: '^[a-f0-9]+$'
    ConstraintDescription: Hex de al menos 32 caracteres (openssl rand -hex 32)
    Description: Valor del header X-Origin-Verify que CloudFront envia al ALB. Se pasa en el deploy, nunca se commitea.

  CloudFrontOriginPrefixListId:
    Type: String
    Default: pl-b6a144df
    Description: Managed prefix list com.amazonaws.global.cloudfront.origin-facing (el ID cambia por region; este es us-east-2)

  AppPort:
    Type: Number
    Default: 8080

  HealthCheckPath:
    Type: String
    Default: /health

Conditions:
  AlbEnabled: !Equals [!Ref CreateAlb, 'true']

Resources:
  # Sin Condition a proposito: un Target Group no cuesta nada y su ARN
  # tiene que existir siempre para que 05-compute.yaml pueda importarlo.
  AppTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: loan-collections-app-tg
      VpcId: !ImportValue loan-collections-platform-vpc-id
      TargetType: instance
      Protocol: HTTP
      Port: !Ref AppPort
      HealthCheckEnabled: true
      HealthCheckProtocol: HTTP
      HealthCheckPath: !Ref HealthCheckPath
      HealthCheckPort: traffic-port
      HealthCheckIntervalSeconds: 15
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: '200'
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '30'

  # Solo CloudFront llega al ALB. Una prefix list pesa su MaxEntries (55)
  # contra la cuota de 60 reglas inbound del SG.
  AlbHttpIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: AlbEnabled
    Properties:
      GroupId: !ImportValue loan-collections-alb-sg-id
      IpProtocol: tcp
      FromPort: 80
      ToPort: 80
      SourcePrefixListId: !Ref CloudFrontOriginPrefixListId
      Description: HTTP solo desde CloudFront origin-facing (ADR-0013)

  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Condition: AlbEnabled
    Properties:
      Name: loan-collections-alb
      Type: application
      Scheme: internet-facing
      IpAddressType: ipv4
      Subnets:
        - !ImportValue loan-collections-platform-public-subnet-1a
        - !ImportValue loan-collections-platform-public-subnet-1b
      SecurityGroups:
        - !ImportValue loan-collections-alb-sg-id
      LoadBalancerAttributes:
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: 'true'

  # Default 403: la prefix list deja pasar a CUALQUIER distribucion CloudFront,
  # solo la nuestra conoce el secreto.
  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: AlbEnabled
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            StatusCode: '403'
            ContentType: text/plain
            MessageBody: Forbidden

  OriginVerifyRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Condition: AlbEnabled
    Properties:
      ListenerArn: !Ref HttpListener
      Priority: 1
      Conditions:
        - Field: http-header
          HttpHeaderConfig:
            HttpHeaderName: X-Origin-Verify
            Values:
              - !Ref OriginVerifySecret
      Actions:
        - Type: forward
          TargetGroupArn: !Ref AppTargetGroup

  # La API no tiene autenticacion todavia: el filtro por IP se hace en el
  # borde, que es el ultimo punto donde se ve la IP real del cliente.
  IpFilterFunction:
    Type: AWS::CloudFront::Function
    Condition: AlbEnabled
    Properties:
      Name: loan-collections-ip-filter
      AutoPublish: true
      FunctionConfig:
        Comment: Permite solo la IP del desarrollador (ADR-0013)
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub
        - |
          function handler(event) {
            if (event.viewer.ip !== '${ClientIp}') {
              return { statusCode: 403, statusDescription: 'Forbidden' };
            }
            return event.request;
          }
        - ClientIp: !Select [0, !Split ['/', !Ref AllowedClientCidr]]

  CdnDistribution:
    Type: AWS::CloudFront::Distribution
    Condition: AlbEnabled
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: loan-collections - HTTPS delante del ALB (ADR-0013)
        PriceClass: PriceClass_100
        HttpVersion: http2
        # El filtro de IP es IPv4 /32; con IPv6 el navegador podria entrar por v6 y quedar bloqueado.
        IPV6Enabled: false
        Origins:
          - Id: alb-origin
            DomainName: !GetAtt ApplicationLoadBalancer.DNSName
            CustomOriginConfig:
              OriginProtocolPolicy: http-only
              HTTPPort: 80
            OriginCustomHeaders:
              - HeaderName: X-Origin-Verify
                HeaderValue: !Ref OriginVerifySecret
        DefaultCacheBehavior:
          TargetOriginId: alb-origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
          CachedMethods: [GET, HEAD]
          # Managed-CachingDisabled: es una API, no contenido estatico.
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          # Managed-AllViewerExceptHostHeader: el ALB recibe su propio Host.
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          Compress: true
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt IpFilterFunction.FunctionMetadata.FunctionARN
        ViewerCertificate:
          CloudFrontDefaultCertificate: true

  # Alarmas del ALB: viven aqui para nacer y morir con el ALB (el nombre completo
  # del ALB lleva un sufijo aleatorio que cambia al recrearlo; ver ADR-0014).
  UnhealthyHostsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: AlbEnabled
    Properties:
      AlarmName: loan-collections-alb-unhealthy-hosts
      AlarmDescription: Al menos un target unhealthy durante 5 minutos seguidos (alineado a HealthCheckGracePeriod 300)
      Namespace: AWS/ApplicationELB
      MetricName: UnHealthyHostCount
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt ApplicationLoadBalancer.LoadBalancerFullName
        - Name: TargetGroup
          Value: !GetAtt AppTargetGroup.TargetGroupFullName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 5
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !ImportValue loan-collections-alerts-topic-arn
      OKActions:
        - !ImportValue loan-collections-alerts-topic-arn

  Target5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: AlbEnabled
    Properties:
      AlarmName: loan-collections-alb-target-5xx
      AlarmDescription: La app respondio mas de 5 errores 5xx en 5 minutos
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt ApplicationLoadBalancer.LoadBalancerFullName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !ImportValue loan-collections-alerts-topic-arn
      OKActions:
        - !ImportValue loan-collections-alerts-topic-arn

Outputs:
  TargetGroupArn:
    Description: ARN del Target Group, lo importa 05-compute.yaml
    Value: !Ref AppTargetGroup
    Export:
      Name: loan-collections-alb-target-group-arn

  AlbDnsName:
    Condition: AlbEnabled
    Description: DNS del ALB. Directo debe dar timeout (SG solo acepta CloudFront)
    Value: !GetAtt ApplicationLoadBalancer.DNSName

  CdnUrl:
    Condition: AlbEnabled
    Description: URL publica HTTPS para probar con curl
    Value: !Sub https://${CdnDistribution.DomainName}