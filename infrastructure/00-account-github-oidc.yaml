AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Account-level GitHub Actions OIDC identity provider (one per URL per account).
  Originally created manually for TMS; imported into CloudFormation in Module 10.

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - ab9d0263244dd0326eb67015705a667e79cfe998
Outputs:
  GitHubOidcProviderArn:
    Description: ARN of the account-level GitHub Actions OIDC provider
    Value: !Ref GitHubOidcProvider
    Export:
      Name: account-github-oidc-provider-arn