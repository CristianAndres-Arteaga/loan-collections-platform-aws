AWSTemplateFormatVersion: '2010-09-09'
Description: ECR repository for the loan-collections API image

Resources:
  ApiRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: loan-collections-api
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      # Regla 1 protege lo promovido (tag prod-<sha>, agregado a mano al desplegar 05).
      # Una imagen retenida por una regla de mayor prioridad no puede expirarla una de menor.
      # Preview 2026-10-03: los hijos (amd64/atestación) de un index protegido tampoco expiran.
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Protect promoted images: keep the last 5 prod-* tags",
                "selection": {
                  "tagStatus": "tagged",
                  "tagPatternList": ["prod-*"],
                  "countType": "imageCountMoreThan",
                  "countNumber": 5
                },
                "action": { "type": "expire" }
              },
              {
                "rulePriority": 2,
                "description": "Keep only the last 10 non-promoted images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 10
                },
                "action": { "type": "expire" }
              }
            ]
          }

Outputs:
  RepositoryUri:
    Value: !GetAtt ApiRepository.RepositoryUri
    Export:
      Name: loan-collections-ecr-repository-uri
  RepositoryArn:
    Value: !GetAtt ApiRepository.Arn
    Export:
      Name: loan-collections-ecr-repository-arn