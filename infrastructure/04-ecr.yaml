AWSTemplateFormatVersion: '2010-09-09'
Description: ECR repository for the loan-collections API image

Resources:
  ApiRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: loan-collections-api
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep only the last 10 images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 10
                },
                "action": { "type": "expire" }
              }
            ]
          }

Outputs:
  RepositoryUri:
    Value: !GetAtt ApiRepository.RepositoryUri
    Export:
      Name: loan-collections-ecr-repository-uri
  RepositoryArn:
    Value: !GetAtt ApiRepository.Arn
    Export:
      Name: loan-collections-ecr-repository-arn